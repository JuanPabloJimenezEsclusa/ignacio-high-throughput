version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 15

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    # Pin the OpenRewrite Gradle plugin to patch-only updates.
    # Minor 7.40.0 and 7.41.0 reference rewrite-bom 8.91.0, which does not
    # exist on Maven Central, and break `gradle build`. Review major/minor
    # bumps manually before upgrading.
    ignore:
      - dependency-name: "org.openrewrite*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    open-pull-requests-limit: 15

  - package-ecosystem: "docker"
    directory: "/deploy-orchestrator/docker-compose/monitoring/fluentd/"
    schedule:
      interval: "weekly"
    groups:
      infrastructure-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/deploy-orchestrator/docker-compose/"
    schedule:
      interval: "weekly"
    groups:
      infrastructure-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 10 * * *"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
