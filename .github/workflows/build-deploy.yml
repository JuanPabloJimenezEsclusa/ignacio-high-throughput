name: Build Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Setup Gradle 9.8
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '9.8.2'
      - name: Build with Maven
        run: mvn -B package -Dmaven.test.skip=true --file pom.xml
      - name: Build with Gradle
        run: gradle build -x test --console=plain --no-daemon
      - name: Deploy with Maven
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings><servers><server><id>github</id>
            <username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password>
          </server></servers></settings>
          EOF
          set -o pipefail
          if mvn -B deploy -Dmaven.test.skip=true --file pom.xml 2>&1 | tee deploy.log; then
            exit 0
          fi
          # GitHub Packages answers 409 when the version is already published; that is the steady state for a fixed 1.0.0
          # shortcut: one coordinate decides for the whole reactor; use per-commit versions if modules can publish separately
          grep -q 'status code: 409' deploy.log &&
            echo "::notice::ignacio-high-throughput 1.0.0 is already published, nothing to deploy"
